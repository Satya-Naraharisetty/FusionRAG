[project]
name = "hybrid-rag-backend"
version = "0.1.0"
description = "FastAPI Backend for Hybrid RAG Chatbot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "psycopg2-binary>=2.9.9",
    "sqlalchemy>=2.0.28",
    "redis>=5.0.3",
    "qdrant-client>=1.8.0",
    "httpx>=0.27.0",
    "httpx2",
    "pyjwt>=2.8.0",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.9",
    "alembic>=1.13.0",
    "email-validator>=2.0.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "ARG", "PTH"]
ignore = ["B008", "E501", "ARG001", "ARG002", "B904", "N818", "UP042", "E712"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "N806", "E501"]
"alembic/*" = ["PTH"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -v"
testpaths = ["backend/tests"]
asyncio_mode = "auto"
norecursedirs = ["backend/app/scratch", "app/scratch", ".venv", ".git"]
timeout = 30

[tool.setuptools]
package-dir = {"" = "backend"}
packages = ["app"]

[dependency-groups]
dev = [
    "pytest-timeout>=2.4.0",
]

