[project]
name = "fusion-rag-backend"
version = "0.1.0"
description = "FastAPI Backend for Fusion RAG Chatbot"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "redis>=5.0.3",
    "qdrant-client>=1.19.0,<2.0.0",
    "httpx>=0.27.0",
    "pyjwt>=2.8.0",
    "argon2-cffi>=23.1.0",
    "python-multipart>=0.0.9",
    "alembic>=1.13.0",
    "email-validator>=2.0.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "pillow>=10.2.0",
    "langdetect>=1.0.9",
    "cryptography==44.0.1",
    "orjson>=3.12.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
    "opentelemetry-exporter-otlp-proto-http>=1.24.0",
    "sympy>=1.13.0",
    "scipy>=1.13.0",
    "numpy>=1.26.0",
    "pypdfium2>=4.30.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "pytest-timeout>=2.4.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.16.0",
    "mypy==2.3.1",
]
eval = [
    "ragas>=0.4.3",
    "deepeval>=4.1.8",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "ARG", "PTH"]
ignore = ["B008", "E501", "ARG001", "ARG002", "B904", "N818", "UP042", "E712", "PTH", "B023", "B039", "ARG004"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "N806", "E501"]
"alembic/*" = ["PTH"]
"scripts/*" = ["N806", "PTH"]
"app/evaluation/reports/*" = ["PTH"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
no_error_summary = true
show_error_codes = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -v"
testpaths = ["tests"]
asyncio_mode = "auto"
norecursedirs = [".venv", ".git"]
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore:.*starlette.testclient.*:DeprecationWarning",
    "ignore:.*Using `httpx` with `starlette.testclient`.*:Warning",
    "ignore:.*Using `httpx` with `starlette.testclient`.*:DeprecationWarning",
    "ignore:.*coroutine 'AsyncMockMixin.*' was never awaited.*:RuntimeWarning",
]

[tool.setuptools]
packages = ["app"]

