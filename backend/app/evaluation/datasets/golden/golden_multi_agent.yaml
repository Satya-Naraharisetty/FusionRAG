dataset_id: golden_multi_agent_v1
version: 1.1.0
description: Production-Grade Multi-Agent Architecture Golden Evaluation Dataset v1.1 measuring planning, routing, dependency execution, bounded replanning, deterministic arithmetic, refusal faithfulness, contradictory evidence arbitration, indirect prompt injection resistance, and replanning exhaustion handling.
samples:
  - id: ma_sample_1_doc_rag
    question: "What is the company refund policy duration?"
    expected_answer: "The refund policy duration is 30 days from purchase."
    expected_specialists:
      - RESEARCH
    expected_routes:
      t1: research.hybrid_rag
    retrieval_required: true
    trigger_replan: false
    metadata:
      expected_specialists: ["RESEARCH"]
      expected_routes:
        t1: "research.hybrid_rag"
      actual_output: "The refund policy duration is 30 days from purchase according to policy.pdf."
      actual_tasks:
        - task_id: "t1"
          agent_type: "RESEARCH"
          routed_capability: "research.hybrid_rag"
          success: true
          dependencies: []
      agent_diagnostics:
        multi_agent_execution: true
        total_specialist_calls: 1
        plan_iterations: 1
        evidence_count: 2
        concurrency_savings_ms: 0.0
        total_time_ms: 150.0
      citations:
        - document_name: "policy.pdf"
          chunk_id: "chk-1"

