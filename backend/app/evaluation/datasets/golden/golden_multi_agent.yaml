        t1: "research.hybrid_rag"
      actual_output: "The available sources report conflicting figures: preliminary_q4.pdf states operating costs were $4.2M, while audited_q4.pdf reports $4.8M. The documents conflict and the authoritative figure cannot be resolved from the text alone."
