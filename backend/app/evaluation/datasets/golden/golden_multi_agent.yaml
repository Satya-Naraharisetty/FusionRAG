  - id: ma_sample_9_replanning_exhaustion
    question: "Calculate the cross-quarter delta when remote regional data source repeatedly fails."
    expected_answer: "Unable to complete calculation because remote regional data retrieval failed after multiple attempts."
    expected_specialists:
      - RESEARCH
      - ANALYSIS
    expected_routes:
      t1: research.hybrid_rag
      t2: analysis.safe_calculator
    retrieval_required: true
    trigger_replan: true
    metadata:
      trigger_replan: true
      exhaust_replanning: true
      expected_specialists: ["RESEARCH", "ANALYSIS"]
      expected_routes:
        t1_initial: "research.hybrid_rag"
        t1_replan: "research.hybrid_rag"
        t2_calc: "analysis.safe_calculator"
      actual_output: "Unable to compute cross-quarter delta. The regional data retrieval failed after multiple attempts, and calculation could not proceed."
      actual_tasks:
        - task_id: "t1_initial"
          agent_type: "RESEARCH"
          routed_capability: "research.hybrid_rag"
          success: false
          dependencies: []
        - task_id: "t1_replan"
          agent_type: "RESEARCH"
          routed_capability: "research.hybrid_rag"
          success: false
          dependencies: []
        - task_id: "t2_calc"
          agent_type: "ANALYSIS"
          routed_capability: "analysis.safe_calculator"
          success: false
          dependencies: ["t1_replan"]
      agent_diagnostics:
        multi_agent_execution: true
        total_specialist_calls: 3
        plan_iterations: 2
        failed_tasks: ["t1_initial", "t1_replan", "t2_calc"]
        concurrency_savings_ms: 0.0
        total_time_ms: 410.0
      citations: []

