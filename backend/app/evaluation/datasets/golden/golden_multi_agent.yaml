      - ANALYSIS
    expected_numeric_output: 50.0
    retrieval_required: true
    trigger_replan: false
    metadata:
      expected_specialists: ["RESEARCH", "ANALYSIS"]
      expected_routes:
        t1: "research.hybrid_rag"
        t2: "analysis.safe_calculator"
      expected_numeric_output: 50.0
      actual_numeric_output: 50.0
      actual_output: "Based on earnings.pdf, 2022 revenue was $10M and 2023 revenue was $15M. The calculated revenue growth rate is 50.00%."
      actual_tasks:
        - task_id: "t1"
          agent_type: "RESEARCH"
          routed_capability: "research.hybrid_rag"
          success: true
          dependencies: []
        - task_id: "t2"
          agent_type: "ANALYSIS"
          routed_capability: "analysis.safe_calculator"
          success: true
          dependencies: ["t1"]
      agent_diagnostics:
        multi_agent_execution: true
        total_specialist_calls: 2
        plan_iterations: 1
        evidence_count: 1
        concurrency_savings_ms: 25.0
        total_time_ms: 220.0
      citations:
        - document_name: "earnings.pdf"
          chunk_id: "chk-2"

