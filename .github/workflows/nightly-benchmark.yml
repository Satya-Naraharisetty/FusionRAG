name: Nightly Evaluation Benchmark & Regression Gate

on:
  schedule:
    # Every night at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Enables manual trigger from GitHub UI

jobs:
  nightly-evaluation:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: 5433
      POSTGRES_DB: hybrid_rag
      REDIS_HOST: localhost
      QDRANT_HOST: localhost
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hybrid_rag
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate CI JWT secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        working-directory: ./backend
        run: |
          uv pip install --system .
          uv pip install --system -e ".[dev,eval]"

      - name: Run Full Golden Benchmark Suite
        working-directory: ./backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FALLBACK_API_KEY: ${{ secrets.GEMINI_FALLBACK_API_KEY || secrets.GEMINI_API_KEY }}
          GEMINI_EMBEDDING_API_KEY: ${{ secrets.GEMINI_EMBEDDING_API_KEY || secrets.GEMINI_API_KEY }}
          GEMINI_LLM_API_KEY: ${{ secrets.GEMINI_LLM_API_KEY || secrets.GEMINI_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          alembic upgrade head
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$GEMINI_FALLBACK_API_KEY" ] && [ -z "$GEMINI_LLM_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "No external API keys found. Executing full profile in MOCK mode."
            python scripts/benchmark.py --dataset app/evaluation/datasets/golden/golden_v1.yaml --profile full --mock
          else
            echo "API keys found. Executing full benchmark suite."
            python scripts/benchmark.py --dataset app/evaluation/datasets/golden/golden_v1.yaml --profile full
          fi

      - name: Run Regression Analysis Against Approved Baseline
        working-directory: ./backend
        run: |
          python scripts/regression.py --baseline-file app/evaluation/baselines/baseline_v1.json --max-score-drop 0.05 --ignore-profile-mismatch

      - name: Upload Benchmark Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-benchmark-reports
          path: backend/data/evaluation/
