name: Nightly Evaluation Benchmark

on:
  schedule:
    # Every night at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Enables manual trigger from GitHub UI

jobs:
  nightly-evaluation:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_SERVER: localhost
      POSTGRES_DB: hybrid_rag
      REDIS_HOST: localhost
      QDRANT_HOST: localhost
      JWT_SECRET: testing_secret
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hybrid_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          uv pip install --system .
          uv pip install --system -e ".[dev]"
          uv pip install --system ragas deepeval langchain-google-vertexai

      - name: Run Standard Benchmark Suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          cd backend
          # Run standard profile; fall back to mock if no secrets are present
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "No API keys found. Executing in MOCK mode."
            python scripts/benchmark.py --dataset tests/evaluation/simple_rag_dataset.json --profile standard --mock
          else
            echo "API keys found. Executing standard benchmark."
            python scripts/benchmark.py --dataset tests/evaluation/simple_rag_dataset.json --profile standard
          fi

      - name: Run Regression Analysis
        run: |
          cd backend
          # Compare the last two runs (the candidate we just ran vs baseline)
          python scripts/regression.py

      - name: Upload Benchmark Reports
        uses: actions/upload-artifact@v4
        with:
          name: nightly-benchmark-reports
          path: backend/data/evaluation/
