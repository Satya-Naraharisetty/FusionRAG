name: Nightly Evaluation Benchmark & Regression Gate

on:
  schedule:
    # Every night at 2:00 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Enables manual trigger from GitHub UI

jobs:
  nightly-evaluation:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: fusion_rag_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      QDRANT_HOST: localhost
      QDRANT_PORT: 6333
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fusion_rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.12.0
        ports:
          - 6333:6333
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate CI Secrets
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ENCRYPTION_MASTER_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        working-directory: ./backend
        run: |
          uv pip install --system .
          uv pip install --system -e ".[dev,eval]"

      - name: Run Nightly Golden Benchmark Suite
        working-directory: ./backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FALLBACK_API_KEY: ${{ secrets.GEMINI_FALLBACK_API_KEY || secrets.GEMINI_API_KEY }}
          GEMINI_EMBEDDING_API_KEY: ${{ secrets.GEMINI_EMBEDDING_API_KEY || secrets.GEMINI_API_KEY }}
          GEMINI_LLM_API_KEY: ${{ secrets.GEMINI_LLM_API_KEY || secrets.GEMINI_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          alembic upgrade head
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$GEMINI_FALLBACK_API_KEY" ] && [ -z "$GEMINI_LLM_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "No external API keys found. Executing nightly profile in MOCK mode."
            python scripts/benchmark.py --dataset app/evaluation/datasets/golden/golden_v3.yaml --profile nightly --mock --output-json data/evaluation/nightly_golden_v3.json
          else
            echo "API keys found. Executing nightly benchmark suite."
            python scripts/benchmark.py --dataset app/evaluation/datasets/golden/golden_v3.yaml --profile nightly --output-json data/evaluation/nightly_golden_v3.json
          fi

      - name: Run Multi-Agent Architecture Benchmark
        working-directory: ./backend
        run: |
          python scripts/benchmark.py --dataset app/evaluation/datasets/golden/golden_multi_agent.yaml --profile multi_agent --mock --output-json data/evaluation/nightly_multi_agent.json

      - name: Run Regression Analysis Against Approved Baselines
        working-directory: ./backend
        run: |
          echo "=== Enforcing Baseline v3 Regression Gate ==="
          python scripts/regression.py --candidate-json data/evaluation/nightly_golden_v3.json --baseline-file app/evaluation/baselines/baseline_v3.json --max-score-drop 0.05 --ignore-profile-mismatch
          echo "=== Enforcing Multi-Agent Baseline Gate ==="
          python scripts/regression.py --candidate-json data/evaluation/nightly_multi_agent.json --baseline-file app/evaluation/baselines/baseline_multi_agent_v1.json --max-score-drop 0.05 --ignore-profile-mismatch

      - name: Upload Benchmark Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-benchmark-reports
          path: backend/data/evaluation/
