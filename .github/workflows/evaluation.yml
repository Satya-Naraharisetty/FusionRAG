name: PR Evaluation & Regression Gate

on:
  pull_request:
    branches: [ main ]

jobs:
  fast-evaluation:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: hybrid_rag_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      QDRANT_HOST: localhost
      QDRANT_PORT: 6333
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hybrid_rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.12.0
        ports:
          - 6333:6333
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate CI Secrets
        run: |
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "ENCRYPTION_MASTER_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        working-directory: ./backend
        run: |
          uv pip install --system .
          uv pip install --system -e ".[dev,eval]"

      - name: Run Fast Deterministic Golden Benchmark
        working-directory: ./backend
        run: |
          alembic upgrade head
          python scripts/benchmark.py --dataset app/evaluation/datasets/golden/golden_v3.yaml --profile fast_deterministic --mock

      - name: Enforce Regression Gate Against Approved Baseline
        working-directory: ./backend
        run: |
          python scripts/regression.py --baseline-file app/evaluation/baselines/baseline_v3.json --max-score-drop 0.05 --max-latency-increase 20.0

      - name: Upload Evaluation Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-evaluation-reports
          path: backend/data/evaluation/
