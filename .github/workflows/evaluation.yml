name: PR Quick Evaluation Check

on:
  pull_request:
    branches: [ main ]

jobs:
  quick-evaluation:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_SERVER: localhost
      POSTGRES_DB: hybrid_rag
      REDIS_HOST: localhost
      QDRANT_HOST: localhost
      JWT_SECRET: testing_secret
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hybrid_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          uv pip install --system .
          uv pip install --system -e ".[dev]"
          uv pip install --system ragas deepeval langchain-google-vertexai langchain-community

      - name: Run Quick Mock Benchmark
        run: |
          cd backend
          alembic upgrade head
          python scripts/benchmark.py --dataset tests/evaluation/simple_rag_dataset.json --profile quick --mock

      - name: Upload Evaluation Reports
        uses: actions/upload-artifact@v4
        with:
          name: pr-evaluation-reports
          path: backend/data/evaluation/
