name: PR Evaluation & Regression Gate

on:
  pull_request:
    branches: [ main ]

jobs:
  fast-evaluation:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: 5433
      POSTGRES_DB: hybrid_rag
      REDIS_HOST: localhost
      QDRANT_HOST: localhost
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hybrid_rag
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate CI JWT secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        working-directory: ./backend
        run: |
          uv pip install --system .
          uv pip install --system -e ".[dev]"
          uv pip install --system ragas deepeval langchain-google-vertexai langchain-community

      - name: Run Fast Deterministic Golden Benchmark
        working-directory: ./backend
        run: |
          alembic upgrade head
          python scripts/benchmark.py --dataset app/evaluation/datasets/golden/golden_v1.yaml --profile fast_deterministic --mock

      - name: Enforce Regression Gate Against Approved Baseline
        working-directory: ./backend
        run: |
          python scripts/regression.py --baseline-file app/evaluation/baselines/baseline_v1.json --max-score-drop 0.03 --max-latency-increase 20.0

      - name: Upload Evaluation Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-evaluation-reports
          path: backend/data/evaluation/
