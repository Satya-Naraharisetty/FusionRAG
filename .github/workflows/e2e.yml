name: E2E Login Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: e2e-login-${{ github.ref }}
  cancel-in-progress: true

jobs:
  login-smoke:
    name: Login flow (browser smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Pin the compose project name so the pre-built backend image tag
    # (fusion_rag-backend:latest) is deterministic regardless of the checkout
    # directory name.
    env:
      COMPOSE_PROJECT_NAME: fusion_rag
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # backend/.env is gitignored but required by docker-compose.yml
      # (env_file). The login/API smoke tests need no LLM key — they only need
      # a JWT_SECRET (required at startup) and COOKIE_SECURE=False so the
      # refresh cookie is stored over plain http://localhost — otherwise the
      # session-persistence check in the e2e script fails.
      - name: Create backend .env for CI
        run: |
          JWT_SECRET="ci_$(openssl rand -hex 32)"
          cat > backend/.env <<EOF
          JWT_SECRET=$JWT_SECRET
          COOKIE_SECURE=False
          REQUIRE_EMAIL_VERIFICATION=False
          DATABASE_URL=postgresql://postgres:postgres@postgres:5432/fusion_rag
          POSTGRES_SERVER=postgres
          POSTGRES_PORT=5432
          POSTGRES_DB=fusion_rag
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          REDIS_HOST=redis
          QDRANT_HOST=qdrant
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          GEMINI_FALLBACK_API_KEY=${{ secrets.GEMINI_FALLBACK_API_KEY || secrets.GEMINI_API_KEY }}
          GEMINI_EMBEDDING_API_KEY=${{ secrets.GEMINI_EMBEDDING_API_KEY || secrets.GEMINI_API_KEY }}
          GEMINI_LLM_API_KEY=${{ secrets.GEMINI_LLM_API_KEY || secrets.GEMINI_API_KEY }}
          JINA_API_KEY=${{ secrets.JINA_API_KEY }}
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (cached)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: fusion_rag-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boot only the services the login flow needs. The frontend runs as the
      # Vite dev server on :5173 (which is also the CORS-whitelisted origin)
      # instead of building the nginx image.
      - name: Boot docker compose (postgres, redis, qdrant, backend)
        run: docker compose up -d --no-build postgres redis qdrant backend

      - name: Wait for backend health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/api/v1/health/liveness >/dev/null 2>&1; then
              echo "backend is healthy after ~$((i * 5))s"
              exit 0
            fi
            sleep 5
          done
          echo "::error::backend did not become healthy within 300s"
          docker compose logs --no-color backend | tail -60
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install --include=optional
          npm rebuild @tailwindcss/oxide

      - name: Run browser login smoke test
        run: |
          cd frontend
          npm run dev > vite.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173 >/dev/null 2>&1 && break
            sleep 2
          done
          if ! curl -sf http://localhost:5173 >/dev/null 2>&1; then
            echo "::error::Vite dev server did not start within 60s"
            cat vite.log
            exit 1
          fi
          # ubuntu-latest ships Google Chrome at /usr/bin/google-chrome; the
          # e2e script drives it via puppeteer-core (it never downloads one).
          CHROME_PATH=/usr/bin/google-chrome npm run e2e:login

      # Two-tier document model E2E — the full document lifecycle against a
      # real chat provider: global upload via the Documents section (@documents
      # in chat), chat-scoped composer attachments (auto-used with no mention,
      # cascade-deleted with the conversation), and the general-knowledge hint
      # for queries that match nothing. Gated on the GEMINI_API_KEY secret
      # because PRs from forks can't access repo secrets — the rest of the
      # suite stays green there. The script's own retry loop absorbs Gemini
      # free-tier 429s. Two placement constraints: it must run BEFORE the
      # redis-fallback steps (those deliberately exhaust the IP-keyed general
      # rate limiter, which would 429 this script's registrations), and it
      # tolerates either owner of :5173 — if the login step's `npm run dev`
      # child survived its trap, this step's own Vite exits EADDRINUSE and the
      # script transparently uses the leftover one (both serve the same
      # source).
      - name: Run two-tier document model E2E
        if: ${{ !cancelled() && env.GEMINI_API_KEY != '' }}
        timeout-minutes: 25
        run: |
          cd frontend
          npm run dev > vite-two-tier.log 2>&1 &
          VITE_PID=$!
          trap 'kill "$VITE_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -sf http://localhost:5173 >/dev/null 2>&1 && break
            sleep 2
          done
          if ! curl -sf http://localhost:5173 >/dev/null 2>&1; then
            echo "::error::Vite dev server did not start within 60s"
            cat vite-two-tier.log
            exit 1
          fi
          CHROME_PATH=/usr/bin/google-chrome npm run e2e:two-tier

      # DELETE /auth/account coverage — a pure API assertion (register →
      # delete → verify the credentials and stale refresh cookie are rejected
      # with 401), independent of the browser flow. It needs no Chrome or Vite
      # dev server, only the backend from the health-wait step. `!cancelled()`
      # keeps the two signals independent (runs even when the browser step
      # failed, but not on a cancelled run): a browser regression here can't
      # mask a delete-endpoint regression and vice versa.
      - name: Run delete-account API smoke test
        if: ${{ !cancelled() }}
        run: |
          cd frontend
          npm run e2e:account-delete

      # Redis-down rate-limit fallback — stops the `redis` service, proves the
      # in-memory limiter still enforces the delete budget (401 ×budget, then
      # 429), restarts redis, and cleans up its own throwaway account. Pure API
      # + docker compose; needs no Chrome or Vite. Runs even if the browser
      # step failed, and always restores redis in a finally block.
      - name: Run Redis-down rate-limit fallback smoke test
        if: ${{ !cancelled() }}
        run: |
          cd frontend
          npm run e2e:redis-fallback

      # Redis-down GENERAL-limiter fallback + per-endpoint isolation — same
      # stop/restart-redis pattern, but hammers /auth/login (IP-keyed, shared
      # by register/chat) until it 429s, then proves the per-user delete budget
      # is still intact (per-endpoint isolation in the shared in-memory store).
      # Also runs after all browser work and restores redis in a finally block.
      - name: Run Redis-down general-limiter isolation smoke test
        if: ${{ !cancelled() }}
        run: |
          cd frontend
          npm run e2e:redis-fallback-login

      - name: Save logs for debugging
        if: always()
        run: |
          mkdir -p e2e-logs
          cp frontend/vite.log e2e-logs/vite.log 2>/dev/null || true
          cp frontend/vite-two-tier.log e2e-logs/vite-two-tier.log 2>/dev/null || true
          docker compose logs --no-color > e2e-logs/docker-compose.log 2>&1 || true

      - name: Upload e2e logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: e2e-logs/
          if-no-files-found: ignore
