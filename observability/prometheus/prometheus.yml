global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "hybrid-rag-backend"
    metrics_path: "/metrics"
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - "backend:8000"
          - "host.docker.internal:8000"
        labels:
          app: "hybrid-rag"
          environment: "local"
