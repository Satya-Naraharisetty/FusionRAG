apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s

  - name: Jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
    jsonData:
      nodeGraph:
        enabled: true
      tracesToMetrics:
        datasourceUid: prometheus
        tags:
          - key: service.name
            value: service
          - key: http.route
            value: route
        queries:
          - name: "RAG Latency (p95)"
            query: 'histogram_quantile(0.95, sum(rate(rag_pipeline_duration_seconds_bucket[5m])) by (le))'
          - name: "HTTP Request Rate"
            query: 'sum(rate(http_server_requests_total[1m]))'
