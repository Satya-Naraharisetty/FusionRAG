services:
  postgres:
    image: postgres:16-alpine
    container_name: hybrid_rag_postgres
    restart: "no"
    environment:
      POSTGRES_DB: hybrid_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hybrid_rag"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Dedicated Postgres for the pytest integration suite. Those tests truncate
  # tables (users, sessions, ...) so they must NEVER point at the dev DB
  # (hybrid_rag). Tests default to this service via backend/tests/db.py
  # (TEST_DATABASE_URL can override). Boot with:
  #   docker compose up -d postgres-test
  postgres-test:
    image: postgres:16-alpine
    container_name: hybrid_rag_postgres_test
    restart: "no"
    environment:
      POSTGRES_DB: hybrid_rag_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hybrid_rag_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hybrid_rag_redis
    restart: "no"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: hybrid_rag_qdrant
    restart: "no"
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:latest
    container_name: hybrid_rag_clamav
    restart: "no"
    ports:
      - "3310:3310"
    environment:
      CLAMAV_NO_FRESHCLAM: "true"

  nginx:
    image: nginx:alpine
    container_name: hybrid_rag_nginx
    restart: "no"
    ports:
      - "8080:80"
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hybrid_rag_backend
    restart: "no"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hybrid_rag
      REDIS_HOST: redis
      QDRANT_HOST: qdrant
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hybrid_rag_frontend
    restart: "no"
    ports:
      - "80:80"
      - "5173:80"

    depends_on:
      - backend
    env_file:
      - ./frontend/.env

volumes:
  postgres_data:
  postgres_test_data:
  redis_data:
  qdrant_data:
