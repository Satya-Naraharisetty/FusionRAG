<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="glow-blue" cx="30%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-indigo" cx="70%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="60%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-grad)" />
  <rect width="1200" height="630" fill="url(#glow-blue)" />
  <rect width="1200" height="630" fill="url(#glow-indigo)" />

  <!-- Subtle Grid Pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.5" />
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Content Container -->
  <g transform="translate(100, 110)">
    <!-- Brand Icon (F) -->
    <g transform="translate(0, 0)">
      <rect width="72" height="72" rx="18" fill="url(#logo-grad)" />
      <rect x="2" y="2" width="68" height="68" rx="16" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
      <text x="36" y="38" font-family="Outfit, system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="central">F</text>
    </g>

    <!-- Project Title -->
    <text x="96" y="52" font-family="Outfit, system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-1">
      Fusion<tspan fill="#3b82f6">RAG</tspan>
    </text>

    <!-- Main Headline -->
    <text x="0" y="160" font-family="Outfit, system-ui, -apple-system, sans-serif" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="-1.5">
      Enterprise Hybrid Retrieval
    </text>
    <text x="0" y="225" font-family="Outfit, system-ui, -apple-system, sans-serif" font-size="54" font-weight="800" fill="url(#text-grad)" letter-spacing="-1.5">
      &amp; Neural Cross-Encoder Reranking
    </text>

    <!-- Tagline -->
    <text x="0" y="285" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
      Dense vectors (Qdrant) + Sparse BM25 fused with RRF for verifiable, grounded QA.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 340)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="180" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="90" y="26" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#93c5fd" text-anchor="middle">Hybrid Search</text>

      <!-- Pill 2 -->
      <rect x="195" y="0" width="220" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="305" y="26" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#a5b4fc" text-anchor="middle">Cross-Encoder Rerank</text>

      <!-- Pill 3 -->
      <rect x="430" y="0" width="200" height="42" rx="21" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="530" y="26" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#f472b6" text-anchor="middle">DeepEval Auditing</text>
    </g>

    <!-- Domain Footer -->
    <text x="0" y="440" font-family="Inter, system-ui, monospace" font-size="18" font-weight="500" fill="#64748b">
      https://fusionrag.vercel.app
    </text>
  </g>
</svg>